name: Build Kernel (KernelSU + AnyKernel3)

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget curl build-essential bc bison flex \
            libncurses5-dev libssl-dev ccache unzip zip python3 lld clang || true
          # ensure clang/lld exist (ubuntu runners usually already have clang)

      - name: Setup AOSP GCC toolchains
        run: |
          mkdir -p "$HOME/toolchains"
          cd "$HOME/toolchains"
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64 || true
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc32 || true
          ls -la

      - name: Detect kernel version
        id: kernelver
        run: |
          cd "$GITHUB_WORKSPACE"
          VERSION=$(grep -m1 "^VERSION =" Makefile | awk '{print $3}')
          PATCHLEVEL=$(grep -m1 "^PATCHLEVEL =" Makefile | awk '{print $3}')
          SUBLEVEL=$(grep -m1 "^SUBLEVEL =" Makefile | awk '{print $3}')
          FULL="${VERSION}.${PATCHLEVEL}.${SUBLEVEL}"
          MAJOR_MINOR="${VERSION}.${PATCHLEVEL}"
          echo "full=${FULL}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${MAJOR_MINOR}" >> "$GITHUB_OUTPUT"
          echo "Detected kernel full: ${FULL}, major.minor: ${MAJOR_MINOR}"

      - name: Add / try KernelSU patches
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          # clone KernelSU (shallow)
          git clone --depth=1 https://github.com/tiann/KernelSU ksu || true
          cd ksu || { echo "ksu clone failed or not present"; exit 0; }
          git submodule update --init --recursive || true

          KVER_FULL="${{ steps.kernelver.outputs.full }}"
          KVER_MM="${{ steps.kernelver.outputs.major_minor }}"

          echo "Looking for KernelSU patch for: $KVER_FULL / $KVER_MM"

          PATCH_APPLIED=0
          for DIR in "next/patches/${KVER_FULL}" "next/patches/${KVER_MM}" "patches/${KVER_FULL}" "patches/${KVER_MM}"; do
            if [ -d "$DIR" ]; then
              echo "Applying KernelSU patches from: $DIR"
              git am "$DIR"/*.patch || { echo "Patch apply failed"; exit 1; }
              PATCH_APPLIED=1
              break
            fi
          done

          if [ "$PATCH_APPLIED" -eq 0 ]; then
            echo "⚠️ No matching KernelSU patch found. Continuing without applying KernelSU patches."
            # If you want to abort when no patch found, uncomment:
            # echo "No KernelSU patch found - failing build as requested"; exit 1
          fi

      - name: Build kernel (Clang + AOSP GCC)
        env:
          TOOLCHAIN_GCC64: ${{ runner.home }}/toolchains/gcc64
          TOOLCHAIN_GCC32: ${{ runner.home }}/toolchains/gcc32
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$TOOLCHAIN_GCC64/bin/aarch64-linux-android-
          export CROSS_COMPILE_ARM32=$TOOLCHAIN_GCC32/bin/arm-linux-androideabi-
          export PATH="$TOOLCHAIN_GCC64/bin:$TOOLCHAIN_GCC32/bin:$PATH"
          export CC=clang
          export LD=ld.lld

          # generate defconfig (adjust name if your defconfig is different)
          make O=out ARCH=arm64 raphael_defconfig

          # ensure module support + disable module signature / IMA if present
          ./scripts/config --file out/.config --set-val CONFIG_MODULES y || true
          ./scripts/config --file out/.config --set-val CONFIG_MODULE_UNLOAD y || true
          ./scripts/config --file out/.config --set-val CONFIG_MODVERSIONS y || true
          ./scripts/config --file out/.config --disable CONFIG_MODULE_SIG || true
          ./scripts/config --file out/.config --disable CONFIG_MODULE_SIG_ALL || true
          ./scripts/config --file out/.config --set-str CONFIG_MODULE_SIG_KEY "" || true
          ./scripts/config --file out/.config --disable CONFIG_IMA || true
          ./scripts/config --file out/.config --disable CONFIG_IMA_APPRAISE || true
          ./scripts/config --file out/.config --disable CONFIG_LOCK_DOWN_LSM || true

          make -s O=out olddefconfig

          # build (pass gcc-toolchain so clang can find GCC libs/rt)
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            --gcc-toolchain="$TOOLCHAIN_GCC64"

          # install modules to a temp folder (optional)
          make -s O=out INSTALL_MOD_PATH=output modules_install || true

      - name: Prepare AnyKernel3 and package flashable ZIP
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf AnyKernel3 || true
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          # copy kernel image(s)
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; th
