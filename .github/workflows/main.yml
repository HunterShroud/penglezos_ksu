name: Kernel Build with KernelSU

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make \
              gcc clang llvm lld git zip unzip wget curl build-essential \
              python3 python3-pip ccache

      - name: Setup Toolchain
        run: |
          mkdir -p ~/toolchains
          cd ~/toolchains
          # GCC 4.9 (still available)
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 --depth=1 gcc64
          # LLVM/Clang 14.0.6 (download from GitHub)
          wget https://github.com/llvm/llvm-project/releases/download/llvmorg-14.0.6/clang+llvm-14.0.6-x86_64-linux-gnu-ubuntu-20.04.tar.xz
          tar -xf clang+llvm-14.0.6-x86_64-linux-gnu-ubuntu-20.04.tar.xz
          mv clang+llvm-14.0.6-x86_64-linux-gnu-ubuntu-20.04 clang

      - name: Detect Kernel Version
        id: kver
        run: |
          cd $GITHUB_WORKSPACE
          KERNEL_VER=$(make kernelversion)
          echo "kernel_ver=$KERNEL_VER" >> $GITHUB_OUTPUT

      - name: Add KernelSU
        run: |
          cd $GITHUB_WORKSPACE
          git clone https://github.com/tiann/KernelSU ksu
          cd ksu
          git submodule update --init --recursive
          if [ -d "next/patches/${{ steps.kver.outputs.kernel_ver }}" ]; then
            git am next/patches/${{ steps.kver.outputs.kernel_ver }}/*
          else
            echo "⚠️ No matching KernelSU patch found for kernel version ${{ steps.kver.outputs.kernel_ver }}"
          fi

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$HOME/toolchains/gcc64/bin:$HOME/toolchains/clang/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-android-
          export CC=clang

          cd $GITHUB_WORKSPACE

          # Generate default config (update this to your device defconfig)
          make raphael_defconfig

          # Enable modules + disable signature enforcement
          ./scripts/config --set-val CONFIG_MODULES y
          ./scripts/config --set-val CONFIG_MODULE_UNLOAD y
          ./scripts/config --set-val CONFIG_MODVERSIONS y
          ./scripts/config --disable CONFIG_MODULE_SIG
          ./scripts/config --disable CONFIG_MODULE_SIG_ALL
          ./scripts/config --set-str CONFIG_MODULE_SIG_KEY ""
          ./scripts/config --disable CONFIG_IMA
          ./scripts/config --disable CONFIG_IMA_APPRAISE
          ./scripts/config --disable CONFIG_LOCK_DOWN_LSM || true

          make olddefconfig

          # Build kernel + modules
          make -j$(nproc)
          make -j$(nproc) modules

      - name: Pack into ZIP
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p output
          cp arch/arm64/boot/Image.gz-dtb output/ || true
          make INSTALL_MOD_PATH=output modules_install || true
          cd output
          zip -r9 kernel-build.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: output/kernel-build.zip
