name: Kernel Build with KernelSU

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make \
              gcc clang llvm lld git zip unzip wget curl build-essential \
              python3 python3-pip ccache

      - name: Setup Toolchain (with Clang fallback)
        run: |
          mkdir -p ~/toolchains
          cd ~/toolchains
          # GCC 4.9
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 --depth=1 gcc64

          # Try Clang 14
          CLANG_URL_14="https://github.com/llvm/llvm-project/releases/download/llvmorg-14.0.6/clang+llvm-14.0.6-x86_64-linux-gnu-ubuntu-20.04.tar.xz"
          CLANG_URL_13="https://github.com/llvm/llvm-project/releases/download/llvmorg-13.0.1/clang+llvm-13.0.1-x86_64-linux-gnu-ubuntu-20.04.tar.xz"

          echo ">>> Downloading Clang 14..."
          if wget -q --spider $CLANG_URL_14; then
            wget $CLANG_URL_14 -O clang.tar.xz
          else
            echo "⚠️ Clang 14 not found, falling back to Clang 13"
            wget $CLANG_URL_13 -O clang.tar.xz
          fi

          tar -xf clang.tar.xz
          mv clang+llvm-* clang

      - name: Detect Kernel Version
        id: kver
        run: |
          cd $GITHUB_WORKSPACE
          KERNEL_MAJOR=$(grep -m1 "^VERSION =" Makefile | awk '{print $3}')
          KERNEL_MINOR=$(grep -m1 "^PATCHLEVEL =" Makefile | awk '{print $3}')
          KERNEL_VER="${KERNEL_MAJOR}.${KERNEL_MINOR}"
          echo "kernel_ver=$KERNEL_VER" >> $GITHUB_OUTPUT

      - name: Add KernelSU
        run: |
          cd $GITHUB_WORKSPACE
          git clone https://github.com/tiann/KernelSU ksu
          cd ksu
          git submodule update --init --recursive

          cd $GITHUB_WORKSPACE
          KERNEL_VER="${{ steps.kver.outputs.kernel_ver }}"
          echo ">>> Detected kernel version: $KERNEL_VER"

          if [ -d "ksu/next/patches/$KERNEL_VER" ]; then
            echo ">>> Applying KernelSU patches for $KERNEL_VER"
            cd ksu
            git am next/patches/$KERNEL_VER/* || { echo "❌ Patch failed"; exit 1; }
          else
            echo "⚠️ No KernelSU patch found for $KERNEL_VER"
            # Choose one behavior:
            # exit 1   # Stop build if KernelSU not supported
            echo ">>> Continuing without KernelSU" # Continue without KernelSU
          fi

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$HOME/toolchains/gcc64/bin:$HOME/toolchains/clang/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-android-
          export CC=clang

          cd $GITHUB_WORKSPACE

          # Generate default config (change to your defconfig!)
          make raphael_defconfig

          # Enable modules + disable signature enforcement
          ./scripts/config --set-val CONFIG_MODULES y
          ./scripts/config --set-val CONFIG_MODULE_UNLOAD y
          ./scripts/config --set-val CONFIG_MODVERSIONS y
          ./scripts/config --disable CONFIG_MODULE_SIG
          ./scripts/config --disable CONFIG_MODULE_SIG_ALL
          ./scripts/config --set-str CONFIG_MODULE_SIG_KEY ""
          ./scripts/config --disable CONFIG_IMA
          ./scripts/config --disable CONFIG_IMA_APPRAISE
          ./scripts/config --disable CONFIG_LOCK_DOWN_LSM || true

          make olddefconfig

          # Build kernel + modules
          make -j$(nproc)
          make -j$(nproc) modules

      - name: Pack into ZIP
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p output
          cp arch/arm64/boot/Image.gz-dtb output/ || true
          make INSTALL_MOD_PATH=output modules_install || true
          cd output
          zip -r9 kernel-build.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: output/kernel-build.zip
