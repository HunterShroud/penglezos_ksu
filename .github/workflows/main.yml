name: Build Kernel with KernelSU

on:
  push:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v3

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget curl build-essential bc bison flex libncurses5-dev libssl-dev ccache unzip zip

      - name: Setup Toolchains (Clang + GCC)
        run: |
          mkdir -p ~/toolchains
          cd ~/toolchains

          echo ">>> Downloading Clang 14"
          if ! wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-14.0.6/clang+llvm-14.0.6-x86_64-linux-gnu-ubuntu-20.04.tar.xz; then
            echo "⚠️ Clang 14 not found, falling back to Clang 13"
            wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-13.0.1/clang+llvm-13.0.1-x86_64-linux-gnu-ubuntu-20.04.tar.xz
            tar -xf clang+llvm-13.0.1-x86_64-linux-gnu-ubuntu-20.04.tar.xz
            mv clang+llvm-13.0.1-x86_64-linux-gnu-ubuntu-20.04 clang
          else
            tar -xf clang+llvm-14.0.6-x86_64-linux-gnu-ubuntu-20.04.tar.xz
            mv clang+llvm-14.0.6-x86_64-linux-gnu-ubuntu-20.04 clang
          fi

          echo ">>> Downloading AOSP GCC 4.9 toolchains"
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc32

      - name: Detect Kernel Version
        id: kernelver
        run: |
          cd $GITHUB_WORKSPACE
          KERNEL_VER=$(grep -m1 "SUBLEVEL" Makefile | awk '{print $3}')
          echo "kernel_ver=$KERNEL_VER" >> $GITHUB_OUTPUT

      - name: Add KernelSU
        run: |
          cd $GITHUB_WORKSPACE
          git clone https://github.com/tiann/KernelSU ksu
          cd ksu
          if git checkout "v${{ steps.kernelver.outputs.kernel_ver }}" 2>/dev/null; then
            echo "✅ Applied KernelSU for version ${{ steps.kernelver.outputs.kernel_ver }}"
            cd ..
            patch -p1 < ksu/kernel.patch || true
          else
            echo "⚠️ No matching KernelSU patch found for kernel version ${{ steps.kernelver.outputs.kernel_ver }}, skipping..."
          fi

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$HOME/toolchains/gcc64/bin/aarch64-linux-android-
          export CROSS_COMPILE_ARM32=$HOME/toolchains/gcc32/bin/arm-linux-androideabi-
          export PATH=$HOME/toolchains/clang/bin:$HOME/toolchains/gcc64/bin:$HOME/toolchains/gcc32/bin:$PATH
          export CC=clang
          export LD=ld.lld

          make O=out ARCH=arm64 vendor/raphael_defconfig
          make -j$(nproc) O=out ARCH=arm64

      - name: Pack into ZIP
        run: |
          cd $GITHUB_WORKSPACE/out/arch/arm64/boot
          zip -r9 $GITHUB_WORKSPACE/raphael-kernel.zip Image.gz-dtb

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: raphael-kernel
          path: raphael-kernel.zip

